appId: ai.hex.workbench
productName: Hex AI Workbench
copyright: Copyright © 2026 Hex AI
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
  - '!AI Resources/**'
  - '!Repos/**'
  - '!data/secrets/**'
  - '!*.gguf'
  - '!.git/**'
  - '!cursor_*.deb'
  - '!cursor_*.AppImage'
asar: true
asarUnpack:
  - '**/*.node'
  - '**/{node-pty,better-sqlite3}/**'
  - '**/ts-intel/**'
extraResources:
  - from: vendor
    to: vendor
    filter:
      - 'bin/**'
      - 'README.md'
linux:
  target:
    - AppImage
    - deb
  category: Development
  synopsis: Local-first Hex AI kernel
win:
  target:
    - nsis
  signAndEditExecutable: false
mac:
  target:
    - dmg
  identity: null
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
publish:
  provider: github
  owner: hex-ai
  repo: workbench
electronUpdaterCompatibility: '>=2.16'
