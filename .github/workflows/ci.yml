name: ci
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: hunt-prevent on this commit
        run: |
          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            git diff --no-color HEAD~1 HEAD | node scripts/assert-hunt-prevent.mjs
          else
            printf '' | node scripts/assert-hunt-prevent.mjs
          fi
      - run: npm test
